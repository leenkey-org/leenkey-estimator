<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Inscription</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Poppins',system-ui,sans-serif;background:#FFFFFF;color:#1E293B}
a{color:#1156FC}a:hover{color:#0D47E0}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #FFFFFF; font-family: 'Poppins', system-ui, sans-serif; color: #1E293B">
  <div style="padding: 20px 20px 0; display: flex; align-items: center; justify-content: space-between">
    <a href="Recherche.dc.html" aria-label="Retour" style="width: 44px; height: 44px; border-radius: 12px; background: #F5F7FB; display: flex; align-items: center; justify-content: center; text-decoration: none"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1E293B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></a>
    <div style="font-size: 18px; font-weight: 700; color: #0F1E35; letter-spacing: -0.3px">Leenkey</div>
    <div style="width: 44px"></div>
  </div>

  <div style="padding: 28px 24px 0; display: flex; flex-direction: column; gap: 8px">
    <h1 style="margin: 0; font-size: 26px; font-weight: 700; color: #0F1E35; line-height: 1.2">Créez votre compte</h1>
    <p style="margin: 0; font-size: 14px; color: #6B7280; line-height: 1.5">Un seul compte pour vendre votre bien ou pour chercher le vôtre.</p>
  </div>

  <div style="padding: 20px 24px 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
    <button style="height: 76px; border: 2px solid #1156FC; border-radius: 14px; background: #EEF4FF; display: flex; flex-direction: column; align-items: flex-start; justify-content: center; gap: 4px; padding: 0 14px; cursor: pointer; font-family: 'Poppins', sans-serif"><span style="font-size: 14px; font-weight: 600; color: #1156FC">Je vends</span><span style="font-size: 12px; color: #4B5563">Un bien à publier</span></button>
    <button style="height: 76px; border: 1.5px solid #E2E8F0; border-radius: 14px; background: #FFFFFF; display: flex; flex-direction: column; align-items: flex-start; justify-content: center; gap: 4px; padding: 0 14px; cursor: pointer; font-family: 'Poppins', sans-serif"><span style="font-size: 14px; font-weight: 600; color: #1E293B">J'achète</span><span style="font-size: 12px; color: #6B7280">Je cherche un bien</span></button>
  </div>

  <div style="padding: 20px 24px 0; display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; flex-direction: column; gap: 6px"><label for="in-prenom" style="font-size: 13px; font-weight: 500">Prénom et nom</label><input id="in-prenom" placeholder="Camille Martin" style="height: 48px; padding: 0 14px; border: 1.5px solid #E2E8F0; border-radius: 12px; font: 400 15px 'Poppins', sans-serif; color: #1E293B"></div>
    <div style="display: flex; flex-direction: column; gap: 6px"><label for="in-email" style="font-size: 13px; font-weight: 500">Email</label><input id="in-email" type="email" placeholder="vous@exemple.fr" style="height: 48px; padding: 0 14px; border: 1.5px solid #E2E8F0; border-radius: 12px; font: 400 15px 'Poppins', sans-serif; color: #1E293B"></div>
    <div style="display: flex; flex-direction: column; gap: 6px"><label for="in-tel" style="font-size: 13px; font-weight: 500">Téléphone <span style="color: #6B7280; font-weight: 400">(facultatif)</span></label><input id="in-tel" type="tel" placeholder="06 00 00 00 00" style="height: 48px; padding: 0 14px; border: 1.5px solid #E2E8F0; border-radius: 12px; font: 400 15px 'Poppins', sans-serif; color: #1E293B"></div>
    <div style="display: flex; flex-direction: column; gap: 6px"><label for="in-mdp" style="font-size: 13px; font-weight: 500">Mot de passe</label><input id="in-mdp" type="password" placeholder="8 caractères minimum" style="height: 48px; padding: 0 14px; border: 1.5px solid #E2E8F0; border-radius: 12px; font: 400 15px 'Poppins', sans-serif; color: #1E293B"></div>
  </div>

  <div style="padding: 16px 24px 0; display: flex; gap: 10px; align-items: flex-start">
    <input id="in-cgu" type="checkbox" style="width: 20px; height: 20px; margin: 2px 0 0; accent-color: #1156FC">
    <label for="in-cgu" style="font-size: 12px; color: #4B5563; line-height: 1.5">J'accepte les <a href="#cgu">conditions d'utilisation</a> et la <a href="#conf">politique de confidentialité</a>.</label>
  </div>

  <div style="padding: 20px 24px 0; display: flex; flex-direction: column; gap: 12px">
    <a href="Bien.dc.html" style="height: 52px; border-radius: 12px; background: #1156FC; color: #FFFFFF; font-size: 15px; font-weight: 600; display: flex; align-items: center; justify-content: center; text-decoration: none">Créer mon compte</a>
    <div style="text-align: center; font-size: 13px; color: #6B7280">Déjà un compte ? <a href="#connexion" style="font-weight: 600">Se connecter</a></div>
  </div>

  <div style="margin-top: auto; padding: 0 24px 28px; display: flex; align-items: center; gap: 10px; color: #6B7280; font-size: 12px">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0E9F6E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
    Vos données restent confidentielles. Aucune diffusion à des tiers.
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
