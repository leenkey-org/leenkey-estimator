<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Fiche du bien</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Poppins',system-ui,sans-serif;background:#F8FAFF;color:#1E293B}
a{color:#1156FC}a:hover{color:#0D47E0}
</style>
</helmet>
<div style="width: 390px; height: 900px; box-sizing: border-box; display: flex; flex-direction: column; background: #F8FAFF; font-family: 'Poppins', system-ui, sans-serif; color: #1E293B">
  <div style="padding: 20px 20px 14px; background: #FFFFFF; border-bottom: 1px solid #E2E8F0; display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; align-items: center; justify-content: space-between">
      <a href="Dashboard.dc.html" aria-label="Retour" style="width: 44px; height: 44px; border-radius: 12px; background: #F5F7FB; display: flex; align-items: center; justify-content: center; text-decoration: none"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1E293B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></a>
      <div style="font-size: 15px; font-weight: 600">Mon bien</div>
      <button style="height: 44px; padding: 0 12px; border: 0; background: transparent; color: #1156FC; font: 600 13px 'Poppins', sans-serif; cursor: pointer">Enregistrer</button>
    </div>
    <div style="display: flex; flex-direction: column; gap: 8px">
      <div style="display: flex; justify-content: space-between; font-size: 12px; color: #6B7280"><span>Étape 2 sur 4 · Caractéristiques</span><span style="font-weight: 600; color: #1156FC">50 %</span></div>
      <div style="height: 6px; border-radius: 100px; background: #E2E8F0; display: flex"><div style="width: 50%; border-radius: 100px; background: #1156FC"></div></div>
    </div>
  </div>

  <div style="padding: 20px; display: flex; flex-direction: column; gap: 16px; flex-grow: 1">
    <div style="padding: 14px 16px; border-radius: 14px; background: #EEF4FF; display: flex; gap: 12px; align-items: flex-start">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1156FC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex: none; margin-top: 1px"><path d="M12 2a7 7 0 0 0-4 12.7V17h8v-2.3A7 7 0 0 0 12 2z"/><path d="M9 21h6"/></svg>
      <div style="font-size: 13px; color: #1A2B4A; line-height: 1.5">Repris de votre estimation du 14 septembre. Vérifiez et complétez.</div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 6px"><label for="b-type" style="font-size: 13px; font-weight: 500">Type de bien</label><select id="b-type" style="height: 48px; padding: 0 14px; border: 1.5px solid #E2E8F0; border-radius: 12px; font: 400 15px 'Poppins', sans-serif; color: #1E293B; background: #FFFFFF"><option>Appartement</option><option>Maison</option></select></div>

    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
      <div style="display: flex; flex-direction: column; gap: 6px"><label for="b-surface" style="font-size: 13px; font-weight: 500">Surface</label><div style="display: flex; align-items: center; height: 48px; padding: 0 14px; border: 1.5px solid #E2E8F0; border-radius: 12px; background: #FFFFFF"><input id="b-surface" value="68" style="border: 0; width: 100%; font: 400 15px 'Poppins', sans-serif; color: #1E293B; outline: none"><span style="font-size: 13px; color: #6B7280">m²</span></div></div>
      <div style="display: flex; flex-direction: column; gap: 6px"><label for="b-pieces" style="font-size: 13px; font-weight: 500">Pièces</label><input id="b-pieces" value="3" style="height: 48px; padding: 0 14px; border: 1.5px solid #E2E8F0; border-radius: 12px; font: 400 15px 'Poppins', sans-serif; color: #1E293B; background: #FFFFFF"></div>
      <div style="display: flex; flex-direction: column; gap: 6px"><label for="b-ch" style="font-size: 13px; font-weight: 500">Chambres</label><input id="b-ch" value="2" style="height: 48px; padding: 0 14px; border: 1.5px solid #E2E8F0; border-radius: 12px; font: 400 15px 'Poppins', sans-serif; color: #1E293B; background: #FFFFFF"></div>
      <div style="display: flex; flex-direction: column; gap: 6px"><label for="b-etage" style="font-size: 13px; font-weight: 500">Étage</label><input id="b-etage" value="3" style="height: 48px; padding: 0 14px; border: 1.5px solid #E2E8F0; border-radius: 12px; font: 400 15px 'Poppins', sans-serif; color: #1E293B; background: #FFFFFF"></div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <div style="font-size: 13px; font-weight: 500">DPE</div>
      <div style="display: flex; gap: 6px">
        <button style="flex: 1; height: 44px; border: 0; border-radius: 10px; background: #F5F7FB; color: #4B5563; font: 600 14px 'Poppins', sans-serif; cursor: pointer">A</button>
        <button style="flex: 1; height: 44px; border: 0; border-radius: 10px; background: #F5F7FB; color: #4B5563; font: 600 14px 'Poppins', sans-serif; cursor: pointer">B</button>
        <button style="flex: 1; height: 44px; border: 0; border-radius: 10px; background: #1156FC; color: #FFFFFF; font: 600 14px 'Poppins', sans-serif; cursor: pointer">C</button>
        <button style="flex: 1; height: 44px; border: 0; border-radius: 10px; background: #F5F7FB; color: #4B5563; font: 600 14px 'Poppins', sans-serif; cursor: pointer">D</button>
        <button style="flex: 1; height: 44px; border: 0; border-radius: 10px; background: #F5F7FB; color: #4B5563; font: 600 14px 'Poppins', sans-serif; cursor: pointer">E</button>
        <button style="flex: 1; height: 44px; border: 0; border-radius: 10px; background: #F5F7FB; color: #4B5563; font: 600 14px 'Poppins', sans-serif; cursor: pointer">F</button>
        <button style="flex: 1; height: 44px; border: 0; border-radius: 10px; background: #F5F7FB; color: #4B5563; font: 600 14px 'Poppins', sans-serif; cursor: pointer">G</button>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <div style="font-size: 13px; font-weight: 500">Atouts</div>
      <div style="display: flex; gap: 8px; flex-wrap: wrap">
        <button style="height: 40px; padding: 0 14px; border: 1.5px solid #1156FC; border-radius: 100px; background: #EEF4FF; color: #1156FC; font: 500 13px 'Poppins', sans-serif; cursor: pointer">Balcon</button>
        <button style="height: 40px; padding: 0 14px; border: 1.5px solid #E2E8F0; border-radius: 100px; background: #FFFFFF; color: #1E293B; font: 500 13px 'Poppins', sans-serif; cursor: pointer">Terrasse</button>
        <button style="height: 40px; padding: 0 14px; border: 1.5px solid #1156FC; border-radius: 100px; background: #EEF4FF; color: #1156FC; font: 500 13px 'Poppins', sans-serif; cursor: pointer">Ascenseur</button>
        <button style="height: 40px; padding: 0 14px; border: 1.5px solid #E2E8F0; border-radius: 100px; background: #FFFFFF; color: #1E293B; font: 500 13px 'Poppins', sans-serif; cursor: pointer">Parking</button>
        <button style="height: 40px; padding: 0 14px; border: 1.5px solid #E2E8F0; border-radius: 100px; background: #FFFFFF; color: #1E293B; font: 500 13px 'Poppins', sans-serif; cursor: pointer">Cave</button>
        <button style="height: 40px; padding: 0 14px; border: 1.5px solid #E2E8F0; border-radius: 100px; background: #FFFFFF; color: #1E293B; font: 500 13px 'Poppins', sans-serif; cursor: pointer">Jardin</button>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <div style="display: flex; justify-content: space-between; align-items: center"><div style="font-size: 13px; font-weight: 500">Photos</div><div style="font-size: 12px; color: #6B7280">4 / 15</div></div>
      <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px">
        <div style="aspect-ratio: 1; border-radius: 10px; background: #DBEAFE; display: flex; align-items: flex-end; padding: 6px; box-sizing: border-box"><span style="font-size: 10px; font-weight: 600; color: #1A2B4A; background: #FFFFFF; padding: 2px 6px; border-radius: 6px">Principale</span></div>
        <div style="aspect-ratio: 1; border-radius: 10px; background: #DBEAFE"></div>
        <div style="aspect-ratio: 1; border-radius: 10px; background: #DBEAFE"></div>
        <div style="aspect-ratio: 1; border-radius: 10px; background: #DBEAFE"></div>
      </div>
      <button style="height: 48px; border: 1.5px dashed #DBEAFE; border-radius: 12px; background: #FFFFFF; color: #1156FC; font: 600 14px 'Poppins', sans-serif; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1156FC" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Ajouter des photos</button>
    </div>
  </div>

  <div style="padding: 14px 20px 24px; background: #FFFFFF; border-top: 1px solid #E2E8F0; display: flex; gap: 10px">
    <button style="flex: 1; height: 52px; border: 1.5px solid #DBEAFE; border-radius: 12px; background: #FFFFFF; color: #1156FC; font: 600 15px 'Poppins', sans-serif; cursor: pointer">Précédent</button>
    <a href="Annonce.dc.html" style="flex: 1.4; height: 52px; border-radius: 12px; background: #1156FC; color: #FFFFFF; font-size: 15px; font-weight: 600; display: flex; align-items: center; justify-content: center; text-decoration: none">Continuer</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":900}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
