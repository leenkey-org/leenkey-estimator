<helmet>

<div style="width: 390px; height: 900px; box-sizing: border-box; display: flex; flex-direction: column; background: #F4F4F1; font-family: 'Archivo', system-ui, sans-serif; color: #0F1E35">
  <div style="padding: 20px 20px 14px; background: #FFFFFF; border-bottom: 1px solid #D9DBD3; display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; align-items: center; justify-content: space-between">
      <a href="Dashboard.dc.html" aria-label="Retour" style="width: 44px; height: 44px; border-radius: 4px; background: #ECEDE8; display: flex; align-items: center; justify-content: center; text-decoration: none"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0F1E35" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></a>
      <div style="font-size: 15px; font-weight: 600">Mon bien</div>
      <button style="height: 44px; padding: 0 12px; border: 0; background: transparent; color: #1156FC; font: 600 13px 'Archivo', sans-serif; cursor: pointer">Enregistrer</button>
    </div>
    <div style="display: flex; flex-direction: column; gap: 8px">
      <div style="display: flex; justify-content: space-between; font-size: 12px; color: #5B6474"><span>Étape 2 sur 4 · Caractéristiques</span><span style="font-weight: 600; color: #1156FC">50 %</span></div>
      <div style="height: 6px; border-radius: 100px; background: #D9DBD3; display: flex"><div style="width: 50%; border-radius: 100px; background: #1156FC"></div></div>
    </div>
  </div>

  <div style="padding: 20px; display: flex; flex-direction: column; gap: 16px; flex-grow: 1">
    <div style="padding: 14px 16px; border-radius: 6px; background: #EEF4FF; display: flex; gap: 12px; align-items: flex-start">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1156FC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex: none; margin-top: 1px"><path d="M12 2a7 7 0 0 0-4 12.7V17h8v-2.3A7 7 0 0 0 12 2z"/><path d="M9 21h6"/></svg>
      <div style="font-size: 13px; color: #1A2B4A; line-height: 1.5">Repris de votre estimation du 14 septembre. Vérifiez et complétez.</div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 6px"><label for="b-type" style="font-size: 13px; font-weight: 500">Type de bien</label><select id="b-type" style="height: 48px; padding: 0 14px; border: 1.5px solid #D9DBD3; border-radius: 4px; font: 400 15px 'Archivo', sans-serif; color: #0F1E35; background: #FFFFFF"><option>Appartement</option><option>Maison</option></select></div>

    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
      <div style="display: flex; flex-direction: column; gap: 6px"><label for="b-surface" style="font-size: 13px; font-weight: 500">Surface</label><div style="display: flex; align-items: center; height: 48px; padding: 0 14px; border: 1.5px solid #D9DBD3; border-radius: 4px; background: #FFFFFF"><input id="b-surface" value="68" style="border: 0; width: 100%; font: 400 15px 'Archivo', sans-serif; color: #0F1E35; outline: none"><span style="font-size: 13px; color: #5B6474">m²</span></div></div>
      <div style="display: flex; flex-direction: column; gap: 6px"><label for="b-pieces" style="font-size: 13px; font-weight: 500">Pièces</label><input id="b-pieces" value="3" style="height: 48px; padding: 0 14px; border: 1.5px solid #D9DBD3; border-radius: 4px; font: 400 15px 'Archivo', sans-serif; color: #0F1E35; background: #FFFFFF"></div>
      <div style="display: flex; flex-direction: column; gap: 6px"><label for="b-ch" style="font-size: 13px; font-weight: 500">Chambres</label><input id="b-ch" value="2" style="height: 48px; padding: 0 14px; border: 1.5px solid #D9DBD3; border-radius: 4px; font: 400 15px 'Archivo', sans-serif; color: #0F1E35; background: #FFFFFF"></div>
      <div style="display: flex; flex-direction: column; gap: 6px"><label for="b-etage" style="font-size: 13px; font-weight: 500">Étage</label><input id="b-etage" value="3" style="height: 48px; padding: 0 14px; border: 1.5px solid #D9DBD3; border-radius: 4px; font: 400 15px 'Archivo', sans-serif; color: #0F1E35; background: #FFFFFF"></div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <div style="font-size: 13px; font-weight: 500">DPE</div>
      <div style="display: flex; gap: 6px">
        <button style="flex: 1; height: 44px; border: 0; border-radius: 4px; background: #ECEDE8; color: #3E4757; font: 600 14px 'Archivo', sans-serif; cursor: pointer">A</button>
        <button style="flex: 1; height: 44px; border: 0; border-radius: 4px; background: #ECEDE8; color: #3E4757; font: 600 14px 'Archivo', sans-serif; cursor: pointer">B</button>
        <button style="flex: 1; height: 44px; border: 0; border-radius: 4px; background: #1156FC; color: #FFFFFF; font: 600 14px 'Archivo', sans-serif; cursor: pointer">C</button>
        <button style="flex: 1; height: 44px; border: 0; border-radius: 4px; background: #ECEDE8; color: #3E4757; font: 600 14px 'Archivo', sans-serif; cursor: pointer">D</button>
        <button style="flex: 1; height: 44px; border: 0; border-radius: 4px; background: #ECEDE8; color: #3E4757; font: 600 14px 'Archivo', sans-serif; cursor: pointer">E</button>
        <button style="flex: 1; height: 44px; border: 0; border-radius: 4px; background: #ECEDE8; color: #3E4757; font: 600 14px 'Archivo', sans-serif; cursor: pointer">F</button>
        <button style="flex: 1; height: 44px; border: 0; border-radius: 4px; background: #ECEDE8; color: #3E4757; font: 600 14px 'Archivo', sans-serif; cursor: pointer">G</button>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <div style="font-size: 13px; font-weight: 500">Atouts</div>
      <div style="display: flex; gap: 8px; flex-wrap: wrap">
        <button style="height: 40px; padding: 0 14px; border: 1.5px solid #1156FC; border-radius: 4px; background: #EEF4FF; color: #1156FC; font: 500 13px 'Archivo', sans-serif; cursor: pointer">Balcon</button>
        <button style="height: 40px; padding: 0 14px; border: 1.5px solid #D9DBD3; border-radius: 4px; background: #FFFFFF; color: #0F1E35; font: 500 13px 'Archivo', sans-serif; cursor: pointer">Terrasse</button>
        <button style="height: 40px; padding: 0 14px; border: 1.5px solid #1156FC; border-radius: 4px; background: #EEF4FF; color: #1156FC; font: 500 13px 'Archivo', sans-serif; cursor: pointer">Ascenseur</button>
        <button style="height: 40px; padding: 0 14px; border: 1.5px solid #D9DBD3; border-radius: 4px; background: #FFFFFF; color: #0F1E35; font: 500 13px 'Archivo', sans-serif; cursor: pointer">Parking</button>
        <button style="height: 40px; padding: 0 14px; border: 1.5px solid #D9DBD3; border-radius: 4px; background: #FFFFFF; color: #0F1E35; font: 500 13px 'Archivo', sans-serif; cursor: pointer">Cave</button>
        <button style="height: 40px; padding: 0 14px; border: 1.5px solid #D9DBD3; border-radius: 4px; background: #FFFFFF; color: #0F1E35; font: 500 13px 'Archivo', sans-serif; cursor: pointer">Jardin</button>
      </div>
    </div>
