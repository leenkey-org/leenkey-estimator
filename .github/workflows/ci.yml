name: CI

on:
  pull_request:
    branches: [v2, main]
  push:
    branches: [v2]

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
        env:
          NEXT_PUBLIC_ENV: production
          # Not a key: the E2E tests serve a stand-in of Google Maps (tests/e2e/google-maps.ts).
          NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: e2e-fake-key
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          CI: "1"
          NEXT_PUBLIC_ENV: production
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  rls:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: supabase/postgres:17.4.1.054
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 54322:5432
        options: >-
          --health-cmd "pg_isready -U postgres -h 127.0.0.1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - run: npm run db:rls-test
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      # Seed twice: same row counts (idempotent), expected volumes, then the
      # permission tests again on the seeded database.
      - name: Seed (idempotence and volumes)
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: |
          export SEED_PASSWORD="$(openssl rand -hex 12)"
          counts() {
            psql "$DATABASE_URL" -At -c "select concat_ws(' ',
              (select count(*) from public.plans), (select count(*) from public.plan_entitlements),
              (select count(*) from public.sale_steps), (select count(*) from public.sale_step_tasks),
              (select count(*) from public.knowledge_base), (select count(*) from auth.users),
              (select count(*) from public.properties), (select count(*) from public.listings),
              (select count(*) from public.subscriptions), (select count(*) from public.conversations),
              (select count(*) from public.messages), (select count(*) from public.sale_task_status),
              (select count(*) from public.favorites), (select count(*) from public.listing_views))"
          }
          npm run db:seed
          first="$(counts)"
          npm run db:seed
          second="$(counts)"
          echo "first:  $first"; echo "second: $second"
          [ "$first" = "$second" ] || { echo "The seed is not idempotent."; exit 1; }
          volumes="$(psql "$DATABASE_URL" -At -c "select concat_ws(' ',
            (select count(*) from public.plans), (select count(*) from public.sale_steps),
            (select count(*) from auth.users where email like '%@test.leenkey.fr'),
            (select count(*) from public.listings where property_id::text like '5eed1000-%' and status = 'published'),
            (select count(*) from public.listings where property_id::text like '5eed1000-%' and status = 'pending'),
            (select count(*) from public.listings where property_id::text like '5eed1000-%' and status = 'rejected'),
            (select count(*) from public.knowledge_base) = (select count(*) from public.knowledge_base where source_file = 'faq-cedric-v2.md'))")"
          echo "volumes: $volumes"
          [ "$volumes" = "3 18 5 12 3 1 t" ] || { echo "Unexpected seed volumes."; exit 1; }
      - run: npm run db:rls-test
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
